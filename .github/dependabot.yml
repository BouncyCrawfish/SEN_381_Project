# Dependabot: opens a pull request when a NuGet package or a GitHub Action used by CI has an update,
# so dependency updates go through the same CI checks and review as any other change.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    target-branch: "development"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "development"
