name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ---------------------------------------------------------------------
  # Stage 1: build + unit tests — BLOCKING
  # Required status check. Must pass before a PR can merge into main.
  # ---------------------------------------------------------------------
  build-and-test:
    name: Build and unit test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (no restore)
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: >
          dotnet test --no-build --configuration Release
          --filter "Category!=Integration"
          --logger "trx;LogFileName=unit-test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: '**/unit-test-results.trx'

  # ---------------------------------------------------------------------
  # Stage 2: integration tests against real PostgreSQL — BLOCKING
  # Kept as a separate, slower stage per Fowler's two-stage pipeline
  # pattern cited in A2 (4.2.3). Only runs after build-and-test passes.
  # ---------------------------------------------------------------------
  integration-test:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: civicconnect
          POSTGRES_PASSWORD: civicconnect_test
          POSTGRES_DB: civicconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__Default: "Host=localhost;Port=5432;Database=civicconnect_test;Username=civicconnect;Password=civicconnect_test"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true

      - name: Restore dependencies
        run: dotnet restore

      - name: Apply database migrations
        run: dotnet ef database update --project src/CivicConnect.Infrastructure

      - name: Run integration tests
        run: >
          dotnet test --configuration Release
          --filter "Category=Integration"
          --logger "trx;LogFileName=integration-test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: '**/integration-test-results.trx'

  # ---------------------------------------------------------------------
  # Lint / formatting — WARNING ONLY (continue-on-error)
  # Per A2 4.2.3: lint starts as a warning so a noisy gate doesn't train
  # the team to ignore it; promote to blocking once the codebase is clean.
  # ---------------------------------------------------------------------
  lint:
    name: Lint (dotnet format)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true

      - name: Check formatting
        run: dotnet format --verify-no-changes --severity warn

  # ---------------------------------------------------------------------
  # Dependency / vulnerability scan — WARNING, blocking only on high severity
  # ---------------------------------------------------------------------
  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true

      - name: Restore dependencies
        run: dotnet restore

      - name: Check for known vulnerabilities (warn only)
        run: dotnet list package --vulnerable --include-transitive
        continue-on-error: true

      - name: Fail on HIGH/CRITICAL vulnerabilities
        run: |
          OUTPUT=$(dotnet list package --vulnerable --include-transitive)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -Eiw "High|Critical"; then
            echo "::error::High or critical severity vulnerability found."
            exit 1
          fi
