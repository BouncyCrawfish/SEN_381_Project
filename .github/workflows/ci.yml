# CivicConnect CI: builds the whole solution and runs the xUnit v3 tests on every push and pull request.
# Runs on Windows because the app and the test project target net10.0-windows (WinForms).
# No secrets are needed: the tests use in-memory fakes. HistoryImmutabilityTests skips itself because
# CIVICCONNECT_TEST_CONNECTION is not set here.

name: CI

on:
  push:
    branches:
      - main
      - development     # change this word if your development branch has a different name
  pull_request:
    branches:
      - main
      - development     # same name as above
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: read            # read-only token: the pipeline cannot push or change the repo

concurrency:                # a newer push to the same branch cancels the older, still-running build
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install the .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet packages
        run: dotnet restore CivicConnect.slnx

      - name: Build
        run: dotnet build CivicConnect.slnx --configuration Release --no-restore

      - name: Run the tests
        run: dotnet test --project Tests/CivicConnect.Tests/CivicConnect.Tests.csproj --configuration Release --no-build
